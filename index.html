<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MHS Billing Tickets</title><link rel="stylesheet" href="style.css"><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script></head><body>
<header><small>MINDFUL HEALTH SOLUTIONS</small><h1>Billing tickets</h1><p>One record. Clear ownership. Timely follow-up.</p></header>
<div id="message" role="status" aria-live="polite">Open this add-in inside Excel.</div>
<section class="toolbar"><button id="setup">Initialize / refresh</button><button id="sync">Sync submissions</button><button id="refresh">Refresh views</button></section>
<nav aria-label="Ticket views"><button data-view="clinic">Clinic Dashboard</button><button data-view="form">Submit New Ticket</button><button data-view="recap">Clinic Recaps</button><button data-view="settings">Settings</button></nav>
<main id="view"></main><dialog id="editor"><form id="editForm"><h2>Edit Master ticket</h2><div id="fields"></div><p>Blanking a field here explicitly clears it. Forms blanks never clear Master.</p><button type="submit">Save to Master</button><button type="button" id="cancel">Cancel</button></form></dialog>
<script type="module" src="app.js"></script></body></html>
