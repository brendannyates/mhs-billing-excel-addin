name: Publish Excel add-in
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generated files are up to date
        run: |
          node scripts/build.mjs
          git diff --exit-code -- rules.js office-scripts
      - run: npm test
      - name: Stage public static assets only (no data, no docs)
        run: |
          mkdir -p public/assets
          cp index.html app.js core.js rules.js excel.js demo.js style.css manifest.xml public/
          cp assets/*.png public/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
